name: verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native-wasm-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Validate release guards and workflow YAML
        run: |
          node --test tests/js/release.test.js
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - name: Install Rust and WASM bindings generator
        run: |
          rustup show
          cargo install wasm-bindgen-cli --version 0.2.105 --locked
      - name: Build unmodified native upstream oracle
        run: |
          cargo build --locked -p ckb-wasm-verifier --bin verify
          cp target/debug/verify target/verify-upstream
      - name: Prepare pinned upstream compatibility patches
        run: ./scripts/prepare.sh
      - name: Native checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -p ckb-wasm-verifier --all-targets --no-deps -- -D warnings
          cargo test --locked -p ckb-wasm-verifier
          cargo build --locked -p ckb-wasm-verifier --bin verify
      - run: npm ci
      - run: npm test && npm run typecheck
      - run: ./scripts/build-wasm.sh
      - run: npm run test:wasm && npm run test:differential
      - name: Compare with unmodified native upstream
        run: CKB_NATIVE_VERIFY="$PWD/target/verify-upstream" npm run test:differential
      - name: Browser Worker without cross-origin isolation
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Package built artifact
        run: |
          npm pack
          node scripts/test-package.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ckb-vm-js-package
          path: '*.tgz'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ckb-vm-js-package
          path: ${{ runner.temp }}/package-roundtrip
      - name: Verify downloaded package bytes
        run: |
          for archive in ckb-vm-js-*.tgz; do
            cmp "$archive" "$RUNNER_TEMP/package-roundtrip/$archive"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-evidence
          path: test-results/
