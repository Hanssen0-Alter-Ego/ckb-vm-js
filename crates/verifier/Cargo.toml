[package]
name = "ckb-wasm-verifier"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Offline CKB transaction verification with caller-supplied context"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ckb-types = { path = "../../vendor/ckb/util/types" }
ckb-jsonrpc-types = { path = "../../vendor/ckb/util/jsonrpc-types" }
ckb-traits = { path = "../../vendor/ckb/traits" }
ckb-script = { path = "../../vendor/ckb/script", default-features = false }
ckb-verification = { path = "../../vendor/ckb/verification" }
ckb-chain-spec = { path = "../../vendor/ckb/spec" }
ckb-resource = { path = "../../vendor/ckb/resource" }
ckb-dao-utils = { path = "../../vendor/ckb/util/dao/utils" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "=0.2.105"
getrandom = { version = "0.2", features = ["js"] }
